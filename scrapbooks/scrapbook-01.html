<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scrapbook 01 – Health</title>

<style>

:root{

    --bg:#ffffff;
    --text:#222;
    --muted:#777;
    --link:#1a36d8;

}

*{

    box-sizing:border-box;

}

body{

    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Georgia, serif;

}

main{

    max-width:1440px;
    margin:0 auto;
    padding:48px 60px 70px;

}

/* -----------------------------------------
   Navigation
----------------------------------------- */

.back{

    display:inline-block;
    margin-bottom:42px;

    color:#444;
    text-decoration:none;

    font-size:30px;
    line-height:1;

}

.back:hover{

    color:#000;

}

/* -----------------------------------------
   Heading
----------------------------------------- */

header{

    text-align:center;
    margin-bottom:46px;

}

.number{

    font-family:Arial,Helvetica,sans-serif;
    text-transform:uppercase;
    letter-spacing:.28em;

    font-size:13px;
    color:var(--muted);

    margin-bottom:12px;

}

h1{

    margin:0;

    font-size:46px;
    font-weight:normal;

}

.subtitle{

    margin-top:12px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:18px;
    color:#666;

}

/* -----------------------------------------
   Viewer
----------------------------------------- */

.viewer{

    width:80%;
    height:760px;

    margin:0 auto 44px;

}

#mirador{

    width:100%;
    height:100%;

}

/* -----------------------------------------
   Continue
----------------------------------------- */

.continue{

    text-align:center;

    margin-top:10px;

    font-family:Arial,Helvetica,sans-serif;

}

.continue a{

    color:var(--link);
    text-decoration:none;

    font-size:18px;

}

.continue a:hover{

    text-decoration:underline;

}

/* -----------------------------------------
   Responsive
----------------------------------------- */

@media (max-width:900px){

    main{

        padding:30px 22px 40px;

    }

    .viewer{

        width:100%;
        height:620px;

    }

}

</style>

</head>

<body>

<main>

    <p style="color:red;font-size:40px;text-align:center;">
THIS IS VERSION 1.1
</p>

<a class="back" href="../propositions.html">
←
</a>

<header>

<div class="number">
SCRAPBOOK 01
</div>

<h1>
Health
</h1>

<div class="subtitle">
World Wide Medical System
</div>

</header>

<section class="viewer">

<div id="mirador"></div>

</section>

<div class="continue">

<a href="../health.html">

Continue → Health

</a>

</div>

</main>

 <style>

#mirador {

    width:100%;
    height:100%;

}

.viewer {

    position:relative;
    overflow:hidden;

}

.mirador-viewer {

    height:100% !important;

}

</style>   

<script src="https://unpkg.com/mirador@4/dist/mirador.min.js"></script>

<script>

Mirador.viewer({

        {

            manifestId: "../iiif/crossings/manifest.json",

        }

    ]

});

</script>

</html>
