<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propositions</title>
<style>
:root{--bg:#d7d7d2;--window:#fff;--bar:#ececea;--text:#222;--line:#b8b8b8}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--text)}
main{max-width:1800px;margin:0 auto;padding:60px 40px 90px}
.back{text-decoration:none;color:#333;font-size:1.8rem}
h1{text-align:center;font-weight:400;letter-spacing:.28em;margin:10px 0 55px}
.windows{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
.window{width:310px;background:var(--window);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.10);transition:.25s}
.window:hover{transform:translateY(-5px);box-shadow:0 12px 28px rgba(0,0,0,.14)}
.window-header{height:34px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 12px;color:#666;font-family:Arial,sans-serif}
.window-body{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#888;font-style:italic}
</style>
</head>
